version: 2
updates:
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-julia-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "Dates"
          - "Distributed"
          - "LinearAlgebra"
          - "Pkg"
          - "Random"
          - "SHA"
          - "SparseArrays"
          - "Statistics"
          - "TOML"
          - "Test"
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "Distributed"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Pkg"
      - dependency-name: "Random"
      - dependency-name: "SHA"
      - dependency-name: "SparseArrays"
      - dependency-name: "Statistics"
      - dependency-name: "TOML"
      - dependency-name: "Test"
  - package-ecosystem: "julia"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-julia-dependencies:
        patterns: ["*"]
  - package-ecosystem: "julia"
    directory: "/examples/toqubo"
    schedule:
      interval: "weekly"
    groups:
      examples-julia-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
