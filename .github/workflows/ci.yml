name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            dependencies: latest
          - version: '1'
            os: ubuntu-latest
            dependencies: latest
          - version: '1'
            os: windows-latest
            dependencies: latest
          - version: '1.10'
            os: ubuntu-latest
            dependencies: toqubo-0.7.1
          - version: '1.10'
            os: ubuntu-latest
            dependencies: lower-bounds
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Resolve dependency floors
        if: matrix.dependencies == 'lower-bounds'
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(name="QUBOPreprocessing", version=v"0.1.0"),
              PackageSpec(name="QUBOTools", version=v"0.16.2"),
              PackageSpec(name="QUBODrivers", version=v"0.6.5"),
              PackageSpec(name="MathOptInterface", version=v"1.0.0"),
          ])
          Pkg.pin(["QUBOPreprocessing", "QUBOTools", "QUBODrivers", "MathOptInterface"])
      - uses: julia-actions/julia-runtest@v1
        if: matrix.dependencies == 'latest'
        with:
          coverage: 'true'
      - name: Released ToQUBO 0.7.1 and complete package suite
        if: matrix.dependencies == 'toqubo-0.7.1'
        shell: julia --project=. {0}
        run: |
          using Pkg
          root = pwd()
          Pkg.activate(mktempdir())
          Pkg.develop(path=root)
          Pkg.add([
              PackageSpec(name="QUBOPreprocessing"),
              PackageSpec(name="ToQUBO", version=v"0.7.1"),
              PackageSpec(name="JuMP"), PackageSpec(name="MathOptInterface"),
              PackageSpec(name="QUBOTools"), PackageSpec(name="QUBODrivers"),
              PackageSpec(name="SparseArrays"),
          ])
          Pkg.pin("ToQUBO")
          @assert Pkg.dependencies()[Base.UUID("9a412ddf-83fa-43b6-9748-7843c851aa65")].version == v"0.7.1"
          Pkg.status()
          include(joinpath(root, "test/runtests.jl"))
      - name: Runtime floor and complete driver conformance
        if: matrix.dependencies == 'lower-bounds'
        shell: julia --project=. {0}
        run: |
          # JuMP 1 requires MOI >= 1.1.1; pure runtime supports MOI 1.0.0.
          # All driver conformance groups run; JuMP runs in every latest lane.
          include(joinpath(pwd(), "test/runtime_floor.jl"))
      - name: Public example and documentation checks
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.instantiate()
          include(joinpath(pwd(), "examples/whole_model.jl"))
          include(joinpath(pwd(), "examples/serial_sweeps.jl"))
          include(joinpath(pwd(), "examples/preprocessing.jl"))
          RootPreprocessingExample.run()
          include(joinpath(pwd(), "docs/check.jl"))
      - name: ToQUBO public examples
        if: matrix.dependencies != 'lower-bounds'
        shell: julia --project=. {0}
        run: |
          using Pkg
          root = pwd()
          Pkg.activate(joinpath(root, "examples/toqubo"))
          Pkg.develop(path=root)
          if "${{ matrix.dependencies }}" == "toqubo-0.7.1"
              Pkg.add(PackageSpec(name="ToQUBO", version=v"0.7.1"))
              Pkg.pin("ToQUBO")
          end
          Pkg.instantiate()
          resolved = Pkg.dependencies()[Base.UUID("9a412ddf-83fa-43b6-9748-7843c851aa65")].version
          @assert resolved >= v"0.7.1"
          if "${{ matrix.dependencies }}" == "toqubo-0.7.1"
              @assert resolved == v"0.7.1"
          end
          Pkg.status()
          include(joinpath(root, "examples/toqubo/refinement.jl"))
          @assert RefinementExample.run(;budget=2).source_feasible
          @assert RefinementExample.run(;budget=8).source_feasible
          include(joinpath(root, "examples/toqubo/deadline.jl"))
          @assert DeadlineExample.run().reason == :feasible
      # One representative full-suite lane supplies coverage; all five lanes stay intact.
      - name: Process package source coverage
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'latest'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - name: Verify package source report
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'latest'
        run: julia .github/scripts/check_coverage.jl
      - name: Retain coverage report
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: source-coverage
          path: lcov.info
          if-no-files-found: error
  coverage:
    name: Source coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: source-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          # Dependabot can use its own upload secret if its OIDC run cannot authenticate.
          use_oidc: ${{ github.actor != 'dependabot[bot]' || secrets.CODECOV_TOKEN == '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
